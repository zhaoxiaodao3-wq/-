# ============================================================
# 销售收支后端 API —— 独立子域名反代配置（已部署到服务器）
# 目标：https://api.mia-fly.cn  →  http://127.0.0.1:4000（Docker 容器）
#
# ✅ 已上线（2026-08-02）：
#   - 部署位置：/www/server/panel/vhost/nginx/api.mia-fly.cn.conf（宝塔站点目录）
#   - Let's Encrypt 证书已签发并安装到：
#       /www/server/panel/vhost/cert/api.mia-fly.cn/fullchain.pem
#       /www/server/panel/vhost/cert/api.mia-fly.cn/privkey.pem
#   - acme.sh 自动续期（/root/.acme.sh，安装时已注册 cron）
#   - 重载命令：/etc/init.d/nginx reload（宝塔的 Nginx 必须用宝塔脚本重载，
#     systemctl reload 不生效——已踩坑确认）
#
# 关键点：proxy_pass 末尾【不带 /】，完整保留路径：
#   https://api.mia-fly.cn/api/auth/login → http://127.0.0.1:4000/api/auth/login
#   https://api.mia-fly.cn/health          → http://127.0.0.1:4000/health
# ============================================================

server {
    listen 80;
    server_name api.mia-fly.cn;
    root /www/wwwroot/api.mia-fly.cn;
    index index.html index.htm;
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }
    location /.well-known/acme-challenge/ { root /www/wwwroot/api.mia-fly.cn; }
    access_log /www/wwwlogs/api.mia-fly.cn.log;
    error_log /www/wwwlogs/api.mia-fly.cn.error.log;
}

server {
    listen 443 ssl http2;
    server_name api.mia-fly.cn;
    root /www/wwwroot/api.mia-fly.cn;
    ssl_certificate /www/server/panel/vhost/cert/api.mia-fly.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.mia-fly.cn/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }
    location /.well-known/acme-challenge/ { root /www/wwwroot/api.mia-fly.cn; }
    access_log /www/wwwlogs/api.mia-fly.cn.log;
    error_log /www/wwwlogs/api.mia-fly.cn.error.log;
}
